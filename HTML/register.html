<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account - Research Collaboration Platform</title>
    <link rel="stylesheet" href="../../CSS/auth.css">
</head>
<body>
    <main class="auth-container">
        <div class="auth-card">
            <div class="brand-header">
                <h1>Create Account</h1>
                <p>Join the research community</p>
            </div>
            <p class="prototype-notice">Demonstration only. Use test details; account information is stored in this browser.</p>

            <form id="registerForm" novalidate>
                <div class="form-group">
                    <label for="role">Select Role</label>
                    <select id="role" name="role" required aria-describedby="roleError">
                        <option value="">Choose your role</option>
                        <option value="researcher">Researcher / Student</option>
                        <option value="supervisor">Supervisor</option>
                        <option value="reviewer">Research Project Reviewer</option>
                    </select>
                    <span id="roleError" class="field-error" role="alert" hidden></span>
                </div>

                <div class="form-group">
                    <label for="fullName">Full Name</label>
                    <input
                        type="text"
                        id="fullName"
                        name="name"
                        autocomplete="name"
                        required
                        placeholder="Enter full name"
                        aria-describedby="fullNameError">
                    <span id="fullNameError" class="field-error" role="alert" hidden></span>
                </div>

                <div class="form-group">
                    <label for="email">University Email</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        autocomplete="email"
                        required
                        placeholder="Enter email address"
                        aria-describedby="emailError">
                    <span id="emailError" class="field-error" role="alert" hidden></span>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        autocomplete="new-password"
                        minlength="6"
                        required
                        placeholder="Minimum 6 characters"
                        aria-describedby="passwordError">
                    <span id="passwordError" class="field-error" role="alert" hidden></span>
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Confirm Password</label>
                    <input
                        type="password"
                        id="confirmPassword"
                        name="confirmPassword"
                        autocomplete="new-password"
                        required
                        placeholder="Re-enter password"
                        aria-describedby="confirmPasswordError">
                    <span id="confirmPasswordError" class="field-error" role="alert" hidden></span>
                </div>

                <div id="regError" class="error-message" role="alert" aria-atomic="true"></div>

                <button type="submit" class="btn-primary">Register</button>
            </form>

            <div class="auth-footer">
                <p>Already have an account? <a href="login.html">Sign In</a></p>
            </div>
        </div>
    </main>

    <script type="module" src="../../JS/Auth.js"></script>
</body>
</html>
