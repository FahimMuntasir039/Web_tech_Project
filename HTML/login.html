<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - Research Collaboration Platform</title>
    <link rel="stylesheet" href="../../CSS/auth.css">
</head>
<body>
    <main class="auth-container">
        <div class="auth-card">
            <div class="brand-header">
                <p class="brand-name">Research Collab</p>
                <p>Paperless planning and review for researchers and students</p>
            </div>

            <form id="loginForm" novalidate>
                <h1 class="auth-form-heading">Welcome Back</h1>
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        autocomplete="username"
                        required
                        placeholder="Enter registered email"
                        aria-describedby="emailError">
                    <span id="emailError" class="field-error" role="alert" hidden></span>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        autocomplete="current-password"
                        required
                        placeholder="Enter password"
                        aria-describedby="passwordError">
                    <span id="passwordError" class="field-error" role="alert" hidden></span>
                </div>

                <div class="auth-options">
                    <label class="show-password-label">
                        <input type="checkbox" id="togglePassword"> Show password
                    </label>
                    <a href="reset-password.html">Forgot password?</a>
                </div>

                <div id="errorMessage" class="error-message" role="alert" aria-atomic="true"></div>

                <button type="submit" class="btn-primary">Sign In</button>
            </form>

            <div class="auth-footer">
                <p>Don't have an account? <a href="register.html">Create Account</a></p>
            </div>
        </div>
    </main>

    <script type="module" src="../../JS/Auth.js"></script>
</body>
</html>
