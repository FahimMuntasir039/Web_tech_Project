<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - Research Collaboration Platform</title>
    <link rel="stylesheet" href="../../CSS/auth.css">
</head>
<body>
    <main class="auth-container">
        <div class="auth-card">
            <div class="brand-header">
                <h1>Reset Password</h1>
                <p>Enter your account email to set a new password</p>
            </div>
            <p class="prototype-notice">Demonstration only. Do not use a real password or sensitive personal information.</p>

            <form id="resetForm" novalidate>
                <div class="form-group">
                    <label for="email">Registered Email</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        autocomplete="username"
                        required
                        placeholder="Enter registered email"
                        aria-describedby="emailError">
                    <span id="emailError" class="field-error" role="alert" hidden></span>
                </div>

                <div class="form-group">
                    <label for="newPassword">New Password</label>
                    <input
                        type="password"
                        id="newPassword"
                        name="newPassword"
                        autocomplete="new-password"
                        minlength="6"
                        required
                        placeholder="Minimum 6 characters"
                        aria-describedby="newPasswordError">
                    <span id="newPasswordError" class="field-error" role="alert" hidden></span>
                </div>

                <div class="form-group">
                    <label for="confirmNewPassword">Confirm New Password</label>
                    <input
                        type="password"
                        id="confirmNewPassword"
                        name="confirmNewPassword"
                        autocomplete="new-password"
                        minlength="6"
                        required
                        placeholder="Re-enter new password"
                        aria-describedby="confirmNewPasswordError">
                    <span id="confirmNewPasswordError" class="field-error" role="alert" hidden></span>
                </div>

                <div id="resetError" class="error-message" role="alert" aria-atomic="true"></div>

                <button type="submit" class="btn-primary">Update Password</button>
            </form>

            <div class="auth-footer">
                <p>Remember your password? <a href="login.html">Sign In</a></p>
            </div>
        </div>
    </main>

    <script type="module" src="../../JS/Auth.js"></script>
</body>
</html>
